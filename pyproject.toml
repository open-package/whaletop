[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "whaletop"
dynamic = ["version"]
description = "htop-style terminal UI for Docker: containers, images, volumes, networks and compose stacks"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["docker", "tui", "terminal", "containers", "compose", "htop"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = ["textual>=1.0", "docker>=7.0"]

[project.urls]
Homepage = "https://github.com/open-package/whaletop"
Source = "https://github.com/open-package/whaletop"
Issues = "https://github.com/open-package/whaletop/issues"
"apt repository" = "https://open-package.github.io/whaletop/"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.7,<10"]

[project.scripts]
whaletop = "whaletop.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "whaletop.__version__" }  # single source of truth: src/whaletop/__init__.py

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
