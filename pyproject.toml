[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "whaletop"
version = "0.1.0"
description = "htop-style terminal UI for Docker: containers, images, volumes, networks and compose stacks"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["docker", "tui", "terminal", "containers", "compose", "htop"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = ["textual>=1.0", "docker>=7.0"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
whaletop = "whaletop.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
