# Rebuilds the signed apt repository from the .deb files of every GitHub release
# and publishes it to GitHub Pages. Runs after each successful release, or by hand.
#
# This is a separate workflow (not a job in release.yml) because workflow_run
# executes on the default branch, which the github-pages environment allows to
# deploy; deployments from tag refs are rejected by default.
name: apt-repo

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    # Also runs when a later release job (e.g. PyPI) failed: the repo is rebuilt from
    # whatever .deb files the releases have, so this is always safe.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Install apt-ftparchive
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils

      - name: Download .deb files from all releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p debs
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | while read -r tag; do
            gh release download "$tag" --pattern '*.deb' --dir debs --skip-existing \
              || echo "::warning::release $tag has no .deb asset, skipped"
          done
          ls -l debs

      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::error::add the APT_SIGNING_KEY secret (armored private key, see packaging/README.md)"
            exit 1
          fi
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          key_id="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          if [ -z "$key_id" ]; then
            echo "::error::APT_SIGNING_KEY contains no private key. It must be the contents of whaletop-apt-signing.private.asc (starting with -----BEGIN PGP PRIVATE KEY BLOCK-----), not the public key."
            exit 1
          fi
          echo "Signing key: $key_id"
          echo "KEY_ID=$key_id" >> "$GITHUB_ENV"

      - name: Check the key can sign
        env:
          GPG_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          if ! echo test | gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                 --local-user "$KEY_ID" --clearsign >/dev/null; then
            echo "::error::Signing with key $KEY_ID failed. If the key has a passphrase, add it as the APT_SIGNING_PASSPHRASE secret."
            exit 1
          fi

      - name: Build signed apt repository
        env:
          GPG_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          packaging/build-apt-repo.sh debs site "$KEY_ID"
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          sed "s|@REPO_URL@|$url|g; s|@GITHUB_URL@|$GITHUB_SERVER_URL/$GITHUB_REPOSITORY|g" \
            packaging/site/index.html > site/index.html
          touch site/.nojekyll

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
