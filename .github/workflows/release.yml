# Release by pushing a tag vX.Y.Z that matches __version__ in src/whaletop/__init__.py.
#
# Order of operations, chosen so that a failure never leaves a half-published version:
#   1. test + build   all artifacts are built and verified; nothing is published.
#                     A failure here leaves no trace: fix, move the tag, retry the
#                     same version.
#   2. pypi           the only irreversible step (PyPI never accepts a version twice).
#   3. github-release created only after PyPI succeeded; safe to re-run.
#   4. pages.yml      runs after this workflow and republishes docs + apt repository.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: pytest -q

  build:
    needs: test
    uses: ./.github/workflows/build.yml
    with:
      release: true

  # Kept minimal: the id-token used for PyPI trusted publishing is only ever
  # available to this job, which runs nothing but the upload.
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/whaletop/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Keep only the Python packages
        run: rm -f dist/*.deb
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # The release can already exist: created in the web UI, or left over from an
      # earlier attempt. GitHub turns a release into a draft when its tag is deleted,
      # so after a tag was moved the existing release is a draft. In every case the
      # result is a published release that holds exactly the files of this build.
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r name; do
              if [ ! -f "dist/$name" ]; then
                echo "Removing stale asset $name"
                gh release delete-asset "$tag" "$name" --yes
              fi
            done
            gh release edit "$tag" --draft=false --latest
          else
            gh release create "$tag" dist/* --title "whaletop $tag" --generate-notes --latest
          fi
