# Release by pushing a tag vX.Y.Z that matches __version__ in src/whaletop/__init__.py.
#
# Order of operations, chosen so that a failure never leaves a half-published version:
#   1. test + build   all artifacts are built and verified; nothing is published.
#                     A failure here leaves no trace: fix, move the tag, retry the
#                     same version.
#   2. pypi           the only irreversible step (PyPI never accepts a version twice).
#   3. github-release created only after PyPI succeeded; safe to re-run.
#   4. pages.yml      runs after this workflow and republishes docs + apt repository.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: pytest -q

  build:
    needs: test
    uses: ./.github/workflows/build.yml
    with:
      release: true

  # Kept minimal: the id-token used for PyPI trusted publishing is only ever
  # available to this job, which runs nothing but the upload.
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/whaletop/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Keep only the Python packages
        run: rm -f dist/*.deb
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # A release created in the web UI already exists (and is already public);
      # then only the files are attached.
      - name: Create GitHub release or attach to existing one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "whaletop $GITHUB_REF_NAME" --generate-notes
          fi
